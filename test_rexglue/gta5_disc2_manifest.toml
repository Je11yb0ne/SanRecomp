# the "insert disc 1" UI. disc2 (play, xex md5 62d61cde) is the actual GAME.
# This manifest targets disc2's default.xex (from the local Xenia GoD content).
[project]
name = "gta5_recomp"
sdk_version = "0.8.0"
game_root = "D:/Games/Xenia/gta5/disc2(play)"

[entrypoint]
file_path = "D:/Games/Xenia/gta5/disc2(play)/default.xex"
